<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Food Menu - Food Demand Forecasting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body data-page="food-menu" class="min-h-full flex flex-col">

    <!-- Top Navigation Bar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- App Title & Back Link -->
                <div class="flex items-center gap-4">
                    <a href="/dashboard" class="text-slate-500 hover:text-slate-900 transition flex items-center gap-1 text-sm font-semibold">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        Dashboard
                    </a>
                    <span class="text-slate-300">|</span>
                    <span class="font-bold text-slate-900 text-base sm:text-lg tracking-tight">Food Menu Management</span>
                </div>

                <!-- User Info & Logout -->
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <span class="text-sm font-semibold text-slate-800">{{ name }}</span>
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-200">
                            👑 Owner
                        </span>
                    </div>
                    <button id="logout-btn" 
                            class="text-xs font-semibold text-slate-600 hover:text-red-600 hover:bg-red-50 px-3 py-2 rounded-lg border border-slate-200 transition flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- Dynamic Alert Container -->
        <div id="alert-container" class="hidden"></div>

        <!-- Add Item Section (Card) -->
        <div class="bg-white rounded-2xl p-6 sm:p-8 border border-slate-200 shadow-sm">
            <h2 class="text-lg font-bold text-slate-900 mb-1">Add New Food Item</h2>
            <p class="text-xs text-slate-500 mb-6">Add dishes to the shop menu for demand estimation and sales tracking.</p>

            <form id="add-item-form" class="grid grid-cols-1 sm:grid-cols-4 gap-4 items-end">
                <div class="sm:col-span-1">
                    <label for="item_name" class="block text-xs font-semibold text-slate-700 mb-1">Item Name</label>
                    <input id="item_name" name="item_name" type="text" required
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 placeholder-slate-400 text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm"
                           placeholder="e.g. Masala Dosa">
                </div>

                <div class="sm:col-span-1">
                    <label for="unit" class="block text-xs font-semibold text-slate-700 mb-1">Serving Unit</label>
                    <select id="unit" name="unit" 
                            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm">
                        <option value="pieces">pieces</option>
                        <option value="plates">plates</option>
                        <option value="portions">portions</option>
                        <option value="kg">kg</option>
                    </select>
                </div>

                <div class="sm:col-span-1">
                    <label for="price" class="block text-xs font-semibold text-slate-700 mb-1">Price (₹)</label>
                    <input id="price" name="price" type="number" step="0.5" min="0" required
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-300 placeholder-slate-400 text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm"
                           placeholder="e.g. 15.00">
                </div>

                <div class="sm:col-span-1">
                    <button id="add-item-btn" type="submit"
                            class="w-full py-2.5 px-4 rounded-xl text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        Add Item
                    </button>
                </div>
            </form>
        </div>

        <!-- Food Menu Table Card -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between">
                <div>
                    <h3 class="text-base font-bold text-slate-900">Current Food Menu</h3>
                    <p class="text-xs text-slate-500">Items available in the system</p>
                </div>
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-700">
                    Total: <strong id="item-count" class="ml-1 text-slate-900">0</strong>
                </span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs font-semibold uppercase tracking-wider border-b border-slate-200">
                            <th class="px-6 py-3.5">Sl. No.</th>
                            <th class="px-6 py-3.5">Item Name</th>
                            <th class="px-6 py-3.5">Unit</th>
                            <th class="px-6 py-3.5">Price (₹)</th>
                            <th class="px-6 py-3.5 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="items-list" class="divide-y divide-slate-100 text-sm">
                        <!-- Items rendered dynamically via JavaScript -->
                        <tr>
                            <td colspan="5" class="px-6 py-8 text-center text-slate-400">
                                Loading food menu...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>

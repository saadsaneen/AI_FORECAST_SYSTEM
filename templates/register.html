<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Staff - Food Demand Forecasting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body data-page="register" class="h-full flex items-center justify-center p-4 sm:p-6 lg:p-8">

    <div class="w-full max-w-md space-y-8 bg-white p-8 sm:p-10 rounded-2xl shadow-xl border border-slate-100">
        <!-- Header / Logo -->
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-100 text-emerald-600 text-3xl mb-4 shadow-inner">
                🍽️
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Malabar Bites</h1>
            <p class="text-xs font-semibold uppercase tracking-wider text-emerald-600 mt-1">Demand Forecasting System</p>
            <h2 class="text-lg font-medium text-slate-600 mt-4">Create Staff Account</h2>
        </div>

        <!-- Dynamic Alert Container -->
        <div id="alert-container" class="hidden"></div>

        <!-- Registration Form (Strictly Username + Password ONLY) -->
        <form id="register-form" class="mt-8 space-y-5">
            <div>
                <label for="name" class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                <input id="name" name="name" type="text" required 
                       class="w-full px-4 py-3 rounded-xl border border-slate-300 placeholder-slate-400 text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition text-sm"
                       placeholder="Choose a username">
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <input id="password" name="password" type="password" required 
                       class="w-full px-4 py-3 rounded-xl border border-slate-300 placeholder-slate-400 text-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition text-sm"
                       placeholder="Create a password">
            </div>

            <div>
                <button id="register-btn" type="submit" 
                        class="w-full flex justify-center py-3.5 px-4 rounded-xl text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 shadow-lg shadow-emerald-600/30 transition duration-150 ease-in-out">
                    Create Account
                </button>
            </div>
        </form>

        <!-- Footer Link -->
        <div class="text-center border-t border-slate-100 pt-6">
            <p class="text-sm text-slate-600">
                Already have an account? 
                <a href="/login" class="font-semibold text-emerald-600 hover:text-emerald-700 hover:underline transition">
                    Sign in here
                </a>
            </p>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
